name: Задать вопрос или предложить улучшение
description: Спросите о Holkas или расскажите, чего вам не хватает
title: "[Вопрос или предложение] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Опишите ситуацию и желаемый результат. Заявка и все вложения будут видны публично.

  - type: dropdown
    id: kind
    attributes:
      label: Тип обращения
      options:
        - Вопрос
        - Предложение по улучшению
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Вопрос или предложение
      description: Расскажите, что вы хотите узнать или какую задачу должно решить улучшение.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия Holkas
      description: Укажите версию, если обращение связано с текущим поведением программы.
      placeholder: Например, v0.1.2

  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
      description: Пример рабочего сценария поможет точнее понять вопрос или предложение.

  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед публикацией
      options:
        - label: Я проверил текст и вложения — в них нет паролей, токенов, строк подключения и конфиденциальных данных.
          required: true

